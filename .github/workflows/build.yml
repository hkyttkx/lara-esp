name: build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers

      - name: Install ldid
        run: brew install ldid

      - name: Install xcpretty
        run: brew install xcpretty || true

      - name: Build IPA
        run: |
          chmod +x scripts/build_ipa.sh
          bash scripts/build_ipa.sh

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lara-ipa
          path: build/lara.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/build.log
          if-no-files-found: ignore
